<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>领导力测评与发展 - 预设问题预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            font-size: 24px;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        /* 方案三：快捷问题气泡 */
        .quick-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .question-bubble {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .question-bubble:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        }

        /* 分类卡片 */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .category-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: #667eea;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.2);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .category-icon {
            font-size: 24px;
        }

        .category-name {
            flex: 1;
            font-weight: 600;
            font-size: 16px;
            color: #667eea;
        }

        .category-count {
            background: #667eea;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        /* 问题列表 */
        .questions-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .question-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f5f7fa;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .question-item:hover {
            background: #e8ecf1;
            transform: translateX(5px);
        }

        .question-number {
            font-weight: 600;
            color: #667eea;
            min-width: 30px;
        }

        .question-text {
            flex: 1;
            font-size: 14px;
        }

        .question-btn {
            padding: 6px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .question-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        /* 标签页 */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 10px 20px;
            background: #f5f7fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .tab:hover {
            border-color: #667eea;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        /* 统计信息 */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            header h1 {
                font-size: 24px;
            }

            .categories-grid {
                grid-template-columns: 1fr;
            }

            .section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 领导力测评与发展</h1>
            <p>点击下方预设问题，快速获取专业解答</p>
        </header>

        <!-- 方案一：快捷问题气泡 -->
        <div class="section">
            <h2>🎯 快捷提问</h2>
            <div class="quick-questions" id="quickQuestions">
                <!-- 动态加载 -->
            </div>
        </div>

        <!-- 方案二：分类导航 -->
        <div class="section">
            <h2>📂 分类浏览</h2>
            <div class="tabs" id="categoryTabs">
                <div class="tab active" data-category="recommended">🌟 推荐问题</div>
                <!-- 动态加载分类 -->
            </div>
            <div class="questions-list" id="questionsList">
                <!-- 动态加载问题 -->
            </div>
        </div>

        <!-- 方案三：分类卡片 -->
        <div class="section">
            <h2>🏷️ 分类概览</h2>
            <div class="categories-grid" id="categoriesGrid">
                <!-- 动态加载 -->
            </div>
        </div>

        <!-- 统计信息 -->
        <div class="section">
            <h2>📊 问题统计</h2>
            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="stat-number">100</div>
                    <div class="stat-label">预设问题总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">8</div>
                    <div class="stat-label">问题分类数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">12.5</div>
                    <div class="stat-label">平均每分类问题数</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 加载预设问题数据
        let presetQuestions = null;
        let currentCategory = 'recommended';

        // 初始化
        async function init() {
            try {
                const response = await fetch('assets/preset_questions.json');
                presetQuestions = await response.json();
                renderQuickQuestions();
                renderCategoryTabs();
                renderCategoriesGrid();
                renderQuestions('recommended');
            } catch (error) {
                console.error('加载预设问题失败:', error);
                document.getElementById('quickQuestions').innerHTML =
                    '<p style="color: #999;">加载失败，请刷新页面重试</p>';
            }
        }

        // 渲染快捷问题（随机6个）
        function renderQuickQuestions() {
            const container = document.getElementById('quickQuestions');
            const allQuestions = presetQuestions.preset_questions.categories.flatMap(
                cat => cat.questions
            );
            const shuffled = allQuestions.sort(() => 0.5 - Math.random());
            const quickQuestions = shuffled.slice(0, 6);

            container.innerHTML = quickQuestions.map(q =>
                `<button class="question-bubble" onclick="alert('${q.replace(/'/g, "\\'")}')">${q}</button>`
            ).join('');
        }

        // 渲染分类标签
        function renderCategoryTabs() {
            const container = document.getElementById('categoryTabs');
            const categories = presetQuestions.preset_questions.categories;

            container.innerHTML = `
                <div class="tab active" data-category="recommended">🌟 推荐问题</div>
                ${categories.map(cat =>
                    `<div class="tab" data-category="${cat.id}">
                        ${cat.icon} ${cat.name}
                    </div>`
                ).join('')}
            `;

            // 添加点击事件
            container.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    container.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    renderQuestions(this.dataset.category);
                });
            });
        }

        // 渲染问题列表
        function renderQuestions(category) {
            const container = document.getElementById('questionsList');
            let questions = [];

            if (category === 'recommended') {
                questions = presetQuestions.preset_questions.recommended_questions;
            } else {
                const cat = presetQuestions.preset_questions.categories.find(c => c.id === category);
                questions = cat ? cat.questions : [];
            }

            if (questions.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">暂无问题</p>';
                return;
            }

            container.innerHTML = questions.map((q, index) => {
                const question = typeof q === 'object' ? q.question : q;
                return `
                    <div class="question-item">
                        <span class="question-number">${index + 1}</span>
                        <span class="question-text">${question}</span>
                        <button class="question-btn" onclick="alert('${question.replace(/'/g, "\\'")}')">
                            提问
                        </button>
                    </div>
                `;
            }).join('');
        }

        // 渲染分类卡片
        function renderCategoriesGrid() {
            const container = document.getElementById('categoriesGrid');
            const categories = presetQuestions.preset_questions.categories;

            container.innerHTML = categories.map(cat => `
                <div class="category-card" onclick="alert('分类：${cat.name}')">
                    <div class="category-header">
                        <span class="category-icon">${cat.icon}</span>
                        <span class="category-name">${cat.name}</span>
                        <span class="category-count">${cat.questions.length}题</span>
                    </div>
                    <div style="font-size: 13px; color: #666;">
                        ${cat.questions.slice(0, 2).map(q => `• ${q.substring(0, 30)}...`).join('<br>')}
                    </div>
                </div>
            `).join('');
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
