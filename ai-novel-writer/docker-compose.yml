version: '3.8'

services:
  # Next.js 应用
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://novelist:Novelist123@postgres:5432/novelist_prod
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MAIL_SERVER=smtp.163.com
      - MAIL_PORT=465
      - MAIL_USE_SSL=true
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
    depends_on:
      - postgres
    restart: unless-stopped

  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=novelist
      - POSTGRES_PASSWORD=Novelist123
      - POSTGRES_DB=novelist_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
